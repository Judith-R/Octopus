<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teamplaner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M8 17l5 5 11-12' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <strong id="brand-title">Teamplaner</strong>
        <span id="mode-badge" class="badge"></span>
      </div>
      <nav id="tabs" aria-label="Bereiche">
        <button data-action="tab" data-tab="overview">Übersicht</button>
        <button data-action="tab" data-tab="team">Team</button>
        <button data-action="tab" data-tab="tasks">Aufgaben</button>
        <button data-action="tab" data-tab="reqs">Formalia</button>
        <button data-action="tab" data-tab="meetings">Termine</button>
      </nav>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <main id="main" aria-live="polite"><p class="muted">Lade Daten …</p></main>

  <footer>
    <button class="link" data-action="export">Daten exportieren (JSON)</button>
    <button class="link" data-action="import">Daten importieren</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </footer>

  <dialog id="dlg">
    <form id="dlg-form" autocomplete="off">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <div class="dlg-actions">
        <button type="button" class="danger" id="dlg-delete" hidden>Löschen</button>
        <span class="spacer"></span>
        <button type="button" data-action="dlg-cancel">Abbrechen</button>
        <button type="submit" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
